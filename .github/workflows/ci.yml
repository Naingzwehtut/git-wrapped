name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Cross-language tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Go vet
        run: cd go && go vet ./...
      - name: Run tests
        run: tests/run.sh
